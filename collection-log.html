<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Collection Log - OSRS Tracker</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="item-dialog.css"><link rel="stylesheet" href="runeprofile.css"><script src="collection-sync.js" defer></script><script src="runeprofile.js" defer></script><script src="item-dialog.js" defer></script><script src="rp-collection.js" defer></script><script src="ui.js" defer></script></head>
<body data-page="collection-log" data-rp-section="collection"><main class="app rp-app">
<header class="rp-top"><a class="brand" href="more.html" aria-label="Back to More">‹ More</a><h1>Collection Log</h1><div class="rp-top-actions"><button id="rp-player-btn" class="rp-player-btn" type="button" aria-haspopup="dialog" aria-label="Change player"><span aria-hidden="true">👤</span><span id="rp-player">Player</span></button><button id="rp-refresh" class="rp-icon-btn" type="button" aria-label="Refresh from RuneProfile" title="Refresh from RuneProfile">↻</button></div></header>
<div class="rp-metaline"><p id="rp-checked"></p><p id="rp-status" role="status" aria-live="polite"></p></div>
<div id="rp-content"></div>
</main>
<dialog id="rp-player-dialog" class="rp-dialog-small" aria-labelledby="rp-player-title"><h2 id="rp-player-title">Player</h2><form id="rp-form"><label for="rp-name">OSRS player name</label><input id="rp-name" name="player" maxlength="12" required autocomplete="off" pattern="[A-Za-z0-9 _\-]{1,12}"><div class="rp-actions"><button class="secondary-button" id="rp-player-cancel" type="button">Cancel</button><button class="primary" type="submit">Load player</button></div></form><p class="note">Data comes from RuneProfile and is separate from Wise Old Man. Refreshing here does not trigger an in-game upload.</p><a id="rp-profile" class="source-link" target="_blank" rel="noopener noreferrer" hidden>Open RuneProfile ↗</a></dialog>
<dialog id="rp-sheet" class="rp-sheet" aria-labelledby="rp-sheet-title"><div class="handle" aria-hidden="true"></div><header class="rp-sheet-head"><div><h2 id="rp-sheet-title" class="rp-sheet-title"></h2><p class="rp-sheet-sub"></p></div><button class="rp-sheet-close" type="button" aria-label="Close">✕</button></header><div class="rp-sheet-body"></div></dialog>
</body></html>
