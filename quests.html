<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Quests - OSRS Tracker</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="runeprofile.css"><script src="runeprofile.js" defer></script><script src="ui.js" defer></script></head>
<body data-page="quests" data-rp-section="quests"><main class="app"><header class="page-toolbar"><a class="brand" href="index.html">OSRS Progress Tracker</a></header><section class="rp-header"><h1>Quests</h1><p id="rp-player"></p><p>RuneProfile uploads are separate from Wise Old Man stats. Refreshing here does not trigger an in-game upload.</p><a id="rp-profile" target="_blank" rel="noopener noreferrer" hidden>Open RuneProfile ↗</a></section>
<form id="rp-form"><label for="rp-name">Player name</label><div class="rp-controls"><input id="rp-name" name="player" maxlength="12" required autocomplete="off" pattern="[A-Za-z0-9 _\-]{1,12}"><button type="submit">Load player</button></div></form>
<section class="rp-panel"><div class="rp-controls"><h2 id="rp-title">Quests</h2><button id="rp-refresh" type="button">Refresh</button></div><p id="rp-status" role="status" aria-live="polite"></p><p id="rp-checked"></p><div id="rp-content"></div></section><p class="rp-note">Wise Old Man data and your manual Collection Log quantities are not changed by this page.</p></main></body></html>
