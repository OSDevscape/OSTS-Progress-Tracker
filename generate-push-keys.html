<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generate VAPID Keys</title><style>body{max-width:750px;margin:30px auto;padding:20px;background:#231e17;color:#e5c779;font:16px system-ui}textarea{width:100%;min-height:95px;margin:8px 0 20px}button{padding:12px}</style></head><body><h1>Generate Web Push Keys</h1><p>Generate once and copy both keys into Netlify environment variables. These keys are generated locally in this browser and are not uploaded. Keep the private key secret. Regenerating keys requires reconnecting devices.</p><button id="generate">Generate Keys</button><h2>VAPID_PUBLIC_KEY</h2><textarea id="public" readonly></textarea><h2>VAPID_PRIVATE_KEY</h2><textarea id="private" readonly></textarea><p id="status"></p><script>function base64url(bytes){let text="";for(const byte of bytes)text+=String.fromCharCode(byte);return btoa(text).split("+").join("-").split("/").join("_").split("=").join("");}function decode(text){const value=atob(text.split("-").join("+").split("_").join("/")+"=".repeat((4-text.length%4)%4));return Uint8Array.from(value,c=>c.charCodeAt(0));}document.getElementById("generate").addEventListener("click",async()=>{try{const pair=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);const key=await crypto.subtle.exportKey("jwk",pair.privateKey);const publicKey=new Uint8Array(65);publicKey[0]=4;publicKey.set(decode(key.x),1);publicKey.set(decode(key.y),33);document.getElementById("public").value=base64url(publicKey);document.getElementById("private").value=key.d;document.getElementById("status").textContent="Copy the keys to Netlify, set VAPID_SUBJECT to mailto:your-real-email-address, then redeploy.";}catch(error){document.getElementById("status").textContent=error.message;}});</script></body></html>
